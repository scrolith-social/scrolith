name: Cloud Readiness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-and-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22.18.0"

      - name: Install backend dependencies
        run: npm ci --prefix geezle-backend

      - name: Generate Prisma client (backend)
        run: npm run prisma:generate --prefix geezle-backend

      - name: Install frontend dependencies
        run: npm ci --prefix geezle

      - name: Build frontend
        env:
          VITE_API_URL: https://api-staging.invalid/api
          VITE_BACKEND_URL: https://api-staging.invalid
          VITE_SCROLITH_ENV: ci
          VITE_PUBLIC_APP_DOMAIN: staging.invalid
        run: npm run build --prefix geezle

      - name: Build backend container image
        run: docker build -f deploy/docker/backend.Dockerfile -t scrolith-backend:ci .

      - name: Build frontend container image
        run: >-
          docker build --pull
          --build-arg VITE_API_URL=https://api-staging.invalid/api
          --build-arg VITE_BACKEND_URL=https://api-staging.invalid
          --build-arg VITE_SCROLITH_ENV=ci
          --build-arg VITE_PUBLIC_APP_DOMAIN=staging.invalid
          -f deploy/docker/frontend.Dockerfile -t scrolith-frontend:ci .
