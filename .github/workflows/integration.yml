name: Integration Tests (retired legacy workflow)

# The prior workflow used production secrets, permissive migration/seed
# fallbacks, and a test path absent from backend/main. It is retained only as
# a disabled marker; Prisma 7 Verification owns backend validation.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    name: Retired; use Prisma 7 Verification
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "This legacy integration workflow is intentionally disabled."
