name: Integration Tests

on:
  pull_request:
    branches:
      - backend/main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: geezle-backend
    env:
      DATABASE_URL: postgresql://scrolith_test:ci-${{ github.run_id }}-${{ github.run_attempt }}-only@127.0.0.1:5432/scrolith_test
      SHADOW_DATABASE_URL: postgresql://scrolith_test:ci-${{ github.run_id }}-${{ github.run_attempt }}-only@127.0.0.1:5432/scrolith_shadow
      PG_ADMIN_URL: postgresql://scrolith_test:ci-${{ github.run_id }}-${{ github.run_attempt }}-only@127.0.0.1:5432/postgres
      NODE_ENV: test
      APP_RUNTIME: test
      DISABLE_BACKGROUND_WORKERS: 'true'
      TEST_DB_KIND: local-disposable
      TEST_DB_PROJECT: local-only
      TEST_DB_INSTANCE: local-disposable-postgres-test
      TEST_DB_NAME: scrolith_test
      TEST_DB_PORT: '5432'
      JWT_SECRET: local_ci_only_jwt_secret
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_TEST_MODE: local
      REDIS_RATE_LIMIT_FAIL_CLOSED: 'true'
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
          POSTGRES_DB: scrolith_test
          POSTGRES_USER: scrolith_test
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U scrolith_test -d scrolith_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 22.18.0
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: geezle-backend/package-lock.json

      - name: Install locked dependencies without install scripts
        run: npm ci --registry=https://registry.npmjs.org --ignore-scripts --no-audit --fund=false

      - name: Create isolated shadow database
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const admin = new pg.Client({ connectionString: process.env.PG_ADMIN_URL });
          await admin.connect();
          try {
            const result = await admin.query(
              'SELECT 1 FROM pg_catalog.pg_database WHERE datname = $1',
              ['scrolith_shadow']
            );
            if (result.rowCount !== 0) throw new Error('Refusing to reuse an existing shadow database.');
            await admin.query('CREATE DATABASE scrolith_shadow OWNER scrolith_test');
          } finally {
            await admin.end();
          }
          NODE

      - name: Verify disposable database target
        run: node scripts/test-db-guard.mjs --guard-only

      - name: Validate Prisma schema and generate client
        run: |
          set -euo pipefail
          npx prisma validate
          npx prisma generate

      - name: Apply disposable migrations
        run: |
          set -euo pipefail
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Run maintained backend integration checks
        run: |
          set -euo pipefail
          # Replaces the legacy secret-dependent startup, health-probe, admin-seed,
          # and deleted admin-profile broadcast flow with isolated assertions.
          node ./node_modules/jest/bin/jest.js \
            --config jest.config.cjs \
            --runInBand \
            --runTestsByPath \
              src/controllers/__tests__/cms.follow-onboarding.controller.spec.ts \
              src/services/__tests__/enterpriseGovernance.service.spec.ts \
              src/__tests__/integration/cms.follow-onboarding.http.authorization.integration.test.ts \
              src/__tests__/integration/cms.follow-onboarding.transaction.integration.test.ts \
            --testTimeout=60000

      - name: Verify TypeScript compilation
        run: npm run build:prod

      - name: Run dependency security gate
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f audit-report.json audit-report.stderr' EXIT

          audit_status=0
          npm audit \
            --registry=https://registry.npmjs.org \
            --omit=dev \
            --audit-level=high \
            --json > audit-report.json 2> audit-report.stderr || audit_status=$?

          AUDIT_STATUS="$audit_status" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const status = Number(process.env.AUDIT_STATUS);
          let report;
          try {
            report = JSON.parse(await readFile('audit-report.json', 'utf8'));
          } catch {
            console.error('NPM_AUDIT_RESULT=INVALID_OR_OPERATIONAL_FAILURE');
            process.exit(1);
          }

          if (report?.error) {
            console.error('NPM_AUDIT_RESULT=REGISTRY_OR_OPERATIONAL_ERROR');
            process.exit(1);
          }

          const counts = report?.metadata?.vulnerabilities;
          const fields = ['info', 'low', 'moderate', 'high', 'critical', 'total'];
          if (!counts || typeof counts !== 'object' || fields.some((field) =>
            !Number.isInteger(counts[field]) || counts[field] < 0
          )) {
            console.error('NPM_AUDIT_RESULT=INVALID_INCOMPLETE_REPORT');
            process.exit(1);
          }

          const componentTotal = ['info', 'low', 'moderate', 'high', 'critical']
            .reduce((sum, field) => sum + counts[field], 0);
          if (counts.total !== componentTotal) {
            console.error('NPM_AUDIT_RESULT=INCONSISTENT_VULNERABILITY_METADATA');
            process.exit(1);
          }

          console.log(`NPM_AUDIT_COUNTS=${JSON.stringify(counts)}`);
          if (counts.high > 0 || counts.critical > 0) {
            console.error('NPM_AUDIT_RESULT=HIGH_OR_CRITICAL_FINDINGS');
            process.exit(1);
          }

          if (!Number.isInteger(status) || status < 0) {
            console.error('NPM_AUDIT_RESULT=INVALID_EXIT_STATUS');
            process.exit(1);
          }

          if (status !== 0) {
            console.error(`NPM_AUDIT_RESULT=UNEXPECTED_NPM_AUDIT_EXIT_${status}`);
            process.exit(1);
          }

          console.log('NPM_AUDIT_RESULT=VALID_NO_HIGH_OR_CRITICAL_FINDINGS');
          NODE

      - name: Validate pull-request diff and historical migration immutability
        shell: bash
        run: |
          set -euo pipefail
          : "${PR_BASE_SHA:?pull-request base SHA is unavailable}"
          : "${PR_HEAD_SHA:?pull-request head SHA is unavailable}"
          : "${PR_MERGE_SHA:?checked-out merge SHA is unavailable}"

          for sha in "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_MERGE_SHA"; do
            if ! git cat-file -e "${sha}^{commit}"; then
              echo "Required pull-request commit is unavailable: $sha" >&2
              exit 1
            fi
          done

          if ! git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" >/dev/null; then
            echo "Pull-request base and head have no comparable history" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$PR_BASE_SHA" "$PR_MERGE_SHA"; then
            echo "Checked-out merge commit is not based on the pull-request base" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$PR_HEAD_SHA" "$PR_MERGE_SHA"; then
            echo "Checked-out merge commit does not contain the reviewed pull-request head" >&2
            exit 1
          fi

          echo "PR_DIFF_BASE=$PR_BASE_SHA"
          echo "PR_DIFF_HEAD=$PR_HEAD_SHA"
          echo "PR_MERGE_COMMIT=$PR_MERGE_SHA"
          git diff --check "$PR_BASE_SHA" "$PR_MERGE_SHA"
          migration_statuses="$(git diff --name-status --find-renames --find-copies-harder "$PR_BASE_SHA" "$PR_MERGE_SHA" -- prisma/migrations)"
          if [[ -n "$migration_statuses" ]]; then
            while IFS=$'\t' read -r status old_path new_path; do
              [[ -n "$status" ]] || continue
              case "$status" in
                A)
                  echo "New Prisma migration added; historical immutability check passed: $old_path"
                  ;;
                M|D|R*|C*|T|U|X|B)
                  echo "Historical or non-additive Prisma migration change is prohibited: $migration_statuses" >&2
                  exit 1
                  ;;
                *)
                  echo "Unrecognized Prisma migration change status: $status" >&2
                  exit 1
                  ;;
              esac
            done <<< "$migration_statuses"
          fi
          echo "Historical Prisma migration immutability check passed."
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
