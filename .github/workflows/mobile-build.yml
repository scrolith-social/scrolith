name: Mobile Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.platforms.outputs.android }}
      ios: ${{ steps.platforms.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect mobile platforms
        id: platforms
        shell: bash
        env:
          ANDROID_FILES: ${{ hashFiles('mobile/android/**') }}
          IOS_FILES: ${{ hashFiles('mobile/ios/**') }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_FILES" ]]; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$IOS_FILES" ]]; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ios=false' >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: detect-platforms
    if: ${{ needs.detect-platforms.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Web Dependencies
        working-directory: geezle
        run: npm install
      - name: Build Web
        working-directory: geezle
        run: npm run build
      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Build Android AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease

  ios:
    needs: detect-platforms
    if: ${{ needs.detect-platforms.outputs.ios == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Web Dependencies
        working-directory: geezle
        run: npm install
      - name: Build Web
        working-directory: geezle
        run: npm run build
      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync ios
      - name: Xcode Build
        working-directory: mobile/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS
