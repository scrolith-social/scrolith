name: Frontend CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, and build without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKEND_URL: https://backend.invalid
      VITE_BACKEND_URL: https://backend.invalid
      VITE_API_URL: https://backend.invalid/api
      VITE_SCROLITH_ENV: ci

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned backend and mobile test dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scrolith-social/scrolith
          ref: 923ca7e25d4ee36ee00aa415eae2b6a60fc9777b
          path: test-dependencies/backend

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Production TypeScript check
        run: npm run typecheck:production

      - name: Certification unit tests
        run: npm run test:cert:unit

      - name: Mobile unit tests
        run: npm run test:mobile:unit
        env:
          SCROLITH_TEST_BACKEND_ROOT: ${{ github.workspace }}/test-dependencies/backend/geezle-backend
          SCROLITH_TEST_MOBILE_ROOT: ${{ github.workspace }}/test-dependencies/backend/mobile

      - name: Certification target safety tests
        run: node --test scripts/certificationTarget.test.mjs

      - name: Build artifact policy tests
        run: node --test scripts/verify-frontend-build-artifact.test.mjs

      - name: API target and feed-state unit tests
        run: >-
          env -u NODE_AUTH_TOKEN npx vitest run
          src/utils/__tests__/apiBasePolicy.spec.ts
          src/utils/__tests__/assetUrl.environment.spec.ts
          src/utils/__tests__/oauthApiUrl.spec.ts
          src/community/__tests__/followState.merge.spec.ts
          src/community/__tests__/storyState.merge.spec.ts

      - name: Build inert CI artifact
        run: env -u NODE_AUTH_TOKEN npm run build

      - name: Inspect generated bundle
        run: node scripts/verify-frontend-build-artifact.mjs dist --expected-api-host backend.invalid --forbidden-api-hosts api.scrolith.com

      - name: Upload non-deployable CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-ci-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3
