name: Prisma 7 Verification

on:
  # One-off validation branch only. This is intentionally not a PR, deployment,
  # or default-branch workflow.
  push:
    branches:
      - codex/pr157-hosted-validation-20261011

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: geezle-backend
    env:
      DATABASE_URL: "postgresql://scrolith_test:ci-${{ github.run_id }}-${{ github.run_attempt }}-only@127.0.0.1:5432/scrolith_test"
      SHADOW_DATABASE_URL: "postgresql://scrolith_test:ci-${{ github.run_id }}-${{ github.run_attempt }}-only@127.0.0.1:5432/scrolith_shadow"
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_TEST_MODE: local
      REDIS_RATE_LIMIT_FAIL_CLOSED: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrolith_test
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}-only"
          POSTGRES_DB: scrolith_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U scrolith_test -d scrolith_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Include the pushed commit's parent so the patch-format check can diff it.
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      - name: Mask generated disposable database password
        env:
          TEST_DB_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}-only"
        run: echo "::add-mask::$TEST_DB_PASSWORD"

      - name: Use Node.js 22.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: geezle-backend/package-lock.json

      - name: Enforce PR workflow secret boundaries
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/check-pr-workflow-secrets.mjs
          node --test scripts/check-pr-workflow-secrets.test.mjs

      - name: Create isolated shadow database
        env:
          PGPASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}-only"
        run: |
          psql --host=127.0.0.1 --username=scrolith_test --dbname=postgres --command="CREATE DATABASE scrolith_shadow OWNER scrolith_test;"

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Wait for CI Redis service
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          node --input-type=module <<'NODE'
          import Redis from 'ioredis';
          const deadline = Date.now() + 30000;
          let lastError = 'unavailable';
          while (Date.now() < deadline) {
            const client = new Redis(process.env.REDIS_URL, {
              lazyConnect: true,
              enableOfflineQueue: false,
              maxRetriesPerRequest: 1,
              connectTimeout: 2000,
              retryStrategy: () => null
            });
            try {
              await client.connect();
              if ((await client.ping()) === 'PONG') {
                await client.quit();
                console.log('CI_REDIS_READY');
                process.exit(0);
              }
            } catch (error) {
              lastError = String(error?.code || error?.name || 'unavailable');
            } finally {
              client.disconnect();
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          console.error(`CI Redis readiness failed: ${lastError}`);
          process.exit(1);
          NODE

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Prisma isolated migration verification
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script

      - name: Seed deterministic CI fixtures
        env:
          NODE_ENV: test
          APP_RUNTIME: test
          DISABLE_BACKGROUND_WORKERS: 'true'
          TEST_DB_KIND: cloudbuild-postgres
          TEST_DB_PROJECT: cloudbuild-ephemeral
          TEST_DB_INSTANCE: cloudbuild-ephemeral-postgres-test
          TEST_DB_NAME: scrolith_test
        run: npm run test:db:seed

      - name: Node contract suites
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_TEST_TIMEOUT_MS: '120000'
          TEST_DB_KIND: cloudbuild-postgres
          TEST_DB_PROJECT: cloudbuild-ephemeral
          TEST_DB_INSTANCE: cloudbuild-ephemeral-postgres-test
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_TEST_MODE: local
          REDIS_RATE_LIMIT_FAIL_CLOSED: 'true'
        run: node scripts/run-node-test-files.mjs

      - name: Focused proxy-trust regression
        env:
          CI: true
        run: npx jest --config jest.config.cjs --runInBand src/middleware/__tests__/authRateLimit.proxyVariation.spec.ts

      - name: Jest regression suites
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_TEST_TIMEOUT_MS: '120000'
          JEST_TEST_TIMEOUT_MS: '60000'
          JEST_GROUP_TIMEOUT_MS: '900000'
          JEST_GROUP_SIZE: '12'
          TEST_DB_KIND: cloudbuild-postgres
          TEST_DB_PROJECT: cloudbuild-ephemeral
          TEST_DB_INSTANCE: cloudbuild-ephemeral-postgres-test
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_TEST_MODE: local
          REDIS_RATE_LIMIT_FAIL_CLOSED: 'true'
        run: npm run test:full

      - name: TypeScript build
        run: npm run build

      - name: Check PR patch formatting
        run: git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"

      - name: Clean backend Docker build
        run: |
          docker build --no-cache --file Dockerfile.pr157-validation --tag scrolith-backend:pr157-validation .
          image_id="$(docker image inspect --format '{{.Id}}' scrolith-backend:pr157-validation)"
          echo "LOCAL_IMAGE_ID=$image_id"
          echo "- Backend image config digest: \`$image_id\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify final runtime artifact and startup health
        shell: bash
        env:
          SMOKE_CONTAINER: scrolith-backend-prisma7-smoke
          SMOKE_PORT: '18080'
        run: |
          set -euo pipefail

          SMOKE_JWT_SECRET="$(
            printf '%s' "scrolith-runtime-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              | sha256sum \
              | awk '{print $1}'
          )"

          cleanup() {
            if docker container inspect "$SMOKE_CONTAINER" >/dev/null 2>&1; then
              exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$SMOKE_CONTAINER" 2>/dev/null || printf '%s' unknown)"
              printf 'FINAL_RUNTIME_EXIT_CODE=%s\n' "$exit_code"
              log_file=''
              sanitized_log_file=''

              if [ "${SMOKE_PASSED:-0}" != "1" ]; then
                printf '%s\n' 'Final runtime smoke test failed; sanitized container logs:'
                if log_file="$(mktemp 2>/dev/null)"; then
                  if docker logs "$SMOKE_CONTAINER" >"$log_file" 2>&1; then
                    if sanitized_log_file="$(mktemp 2>/dev/null)" && \
                      sed -E \
                        -e 's#(postgres(ql)?://)[^@[:space:]]+@#\1[REDACTED]@#g' \
                        -e 's#(redis://)[^@[:space:]]+@#\1[REDACTED]@#g' \
                        -e 's#(Bearer[[:space:]]+)[^[:space:]]+#\1[REDACTED]#gi' \
                        "$log_file" >"$sanitized_log_file"; then
                      if ! cat "$sanitized_log_file"; then
                        printf '%s\n' 'WARNING: sanitized container log output failed; raw logs withheld.' >&2
                      fi
                    else
                      printf '%s\n' 'WARNING: container log sanitization failed; raw logs withheld.' >&2
                    fi
                  else
                    printf '%s\n' 'WARNING: container log collection failed; raw logs withheld.' >&2
                  fi
                else
                  printf '%s\n' 'WARNING: temporary log file creation failed; raw logs withheld.' >&2
                fi
              fi

              docker rm --force "$SMOKE_CONTAINER" >/dev/null 2>&1 || \
                printf '%s\n' 'WARNING: smoke container removal failed.' >&2
              [ -z "$log_file" ] || rm -f "$log_file" || true
              [ -z "$sanitized_log_file" ] || rm -f "$sanitized_log_file" || true
            fi
          }
          trap cleanup EXIT

          test -f dist/scripts/reconcileAdPayments.js
          ! grep -Fq '../../scripts/reconcileAdPayments' dist/scripts/reconcileAdPayments.js

          docker run --detach --name "$SMOKE_CONTAINER" --network host \
            --env NODE_ENV=production \
            --env APP_RUNTIME=ci \
            --env DISABLE_BACKGROUND_WORKERS=true \
            --env PORT="$SMOKE_PORT" \
            --env JWT_SECRET="$SMOKE_JWT_SECRET" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env REDIS_URL="$REDIS_URL" \
            --env REDIS_TEST_MODE=local \
            --env REDIS_RATE_LIMIT_FAIL_CLOSED=true \
            scrolith-backend:pr157-validation >/dev/null

          for attempt in $(seq 1 60); do
            if ! docker inspect --format '{{.State.Running}}' "$SMOKE_CONTAINER" 2>/dev/null | grep -qx true; then
              echo 'Final runtime container exited before readiness.' >&2
              exit 1
            fi
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 "http://127.0.0.1:${SMOKE_PORT}/api/health" || true)"
            if [ "$status" = '200' ]; then
              echo 'FINAL_RUNTIME_HEALTH=200'
              SMOKE_PASSED=1
              export SMOKE_PASSED
              exit 0
            fi
            sleep 2
          done

          echo 'Final runtime health check timed out.' >&2
          exit 1

      - name: Production dependency audit
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --registry=https://registry.npmjs.org --omit=dev --json > "$RUNNER_TEMP/audit-production.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/audit-production.json" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) throw new Error('Production npm audit returned no vulnerability summary.');
          console.log(JSON.stringify(counts));
          fs.appendFileSync(process.argv[3], `\n### Production dependency audit\n\n\`\`\`json\n${JSON.stringify(counts)}\n\`\`\`\n`);
          NODE
          exit "$audit_status"

      - name: Full dependency audit
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/audit-full.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/audit-full.json" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) throw new Error('Full npm audit returned no vulnerability summary.');
          console.log(JSON.stringify(counts));
          fs.appendFileSync(process.argv[3], `\n### Full dependency audit\n\n\`\`\`json\n${JSON.stringify(counts)}\n\`\`\`\n`);
          NODE
          exit "$audit_status"

      - name: Remove audit artifacts
        if: always()
        run: rm -f "$RUNNER_TEMP/audit-production.json" "$RUNNER_TEMP/audit-full.json"
