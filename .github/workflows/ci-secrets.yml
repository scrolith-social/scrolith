name: CI — Inject Secrets and Deploy

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'geezle-backend/docs/**'

  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Explicitly authorize production backend deployment'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify workflow credential boundaries
        run: node --test scripts/ci-secrets-workflow-policy.test.mjs

      - name: Install dependencies
        run: |
          cd geezle-backend
          npm ci

      - name: Build (if present)
        shell: bash
        env:
          VITE_BACKEND_URL: https://backend.invalid
          BACKEND_URL: https://backend.invalid
        run: |
          set -euo pipefail

          cd geezle-backend

          npm run build --if-present

      - name: Run tests (if present)
        run: |
          cd geezle-backend
          npm run test --if-present

  deploy:
    name: Deploy to production (manual authorization required)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.deploy_production == true
      }}

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          missing=0

          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL is not configured in the protected production environment."
            missing=1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::DEPLOY_USER is not configured."
            missing=1
          fi

          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST is not configured."
            missing=1
          fi

          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_PATH is not configured."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Production deployment configuration is present."

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync and restart on remote
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          rsync -avz \
            --delete \
            --exclude='.git' \
            ./geezle-backend/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && npm ci --omit=dev && (pm2 restart geezle || pm2 start npm --name geezle -- start)"
